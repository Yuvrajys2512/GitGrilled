name: CI

# Block broken code from merging: lint, typecheck, and build on every PR to
# main and on direct pushes to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build must not depend on real secrets. These dummy values let the
          # build complete; runtime reads the real values from Vercel env.
          GROQ_API_KEY: dummy-key-for-build
          NEXT_TELEMETRY_DISABLED: "1"
